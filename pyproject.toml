[project]
name = "flowmode"
version = "0.18.0"
description = "Flowmode command-line client: claims, overlap warnings, approvals and handoffs for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.scripts]
flowmode = "flowmode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmode"]
