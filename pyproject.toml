[project]
name = "flowmode"
version = "0.20.0"
description = "Flowmode command-line client: claims, overlap warnings, approvals and handoffs for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.scripts]
flowmode = "flowmode.cli:main"

[build-system]
# exact, the backend and its own runtime dependencies as the 1.32.4 builds used them (F-20-90, red team U-1):
# `--constraints` does not bind build dependencies, these do (one build environment, resolved together)
requires = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmode"]
